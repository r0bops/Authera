packages:
  - apps/*
  - packages/*

# pnpm 11 blocks dependency lifecycle scripts unless listed here.
# esbuild's postinstall only copies its platform binary; the rest are optional native builds
# (testcontainers' ssh2/cpu-features, protobufjs codegen) that we never need.
allowBuilds:
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Explicit exceptions to the minimum-release-age policy (fresh releases reviewed manually).
minimumReleaseAgeExclude:
  - lucide-react@1.37.0

# Keep build-only transitive copies on patched releases (GHSA-67mh-4wv8-2f99,
# GHSA-g7r4-m6w7-qqqr). All consumers use esbuild's stable JS API.
overrides:
  esbuild: 0.28.2
